<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display :flex;
            justify-content: center;
            align-items: center;
            height: 700px;
            padding-bottom: 100px;
        }
        .grid-layout{
            background-color: antiquewhite;
            display:grid;
            grid-template-areas: 'header header header'
                                 'aside section section'
                                 'aside article1 article2'
                                 'footer footer footer';
            text-align: center;                     

        }
        .comman{
            background:linear-gradient(45deg,rgb(47, 0, 255),rgb(130, 195, 238));
            padding: 50px 100px;
            color: white;
        }
        header{
            grid-area:header ;
        }
        aside{
            grid-area: aside;
        }
        #art1{
            grid-area: article1;
        }
        #art2{
            grid-area: article2;
        }
        section{
            grid-area: section;
        }
        footer{
            grid-area: footer;
        }
       
      
    </style>
</head>
<body>
    <div class="grid-layout">
     
       <header class="comman">Header</header>
       <aside class="comman">Sidebar</aside>
       <section class="comman">Content-1</section>
       <article id="art1" class="comman">Content-2</article>
       <article id="art2" class="comman">content-3</article>
       <footer class="comman">Footer</footer>
        
    </div>
</body>
</html>
