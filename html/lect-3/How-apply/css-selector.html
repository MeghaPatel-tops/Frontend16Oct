<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        span{
            color: gray;
        }
        #first{
            color: green;
        }
        .sec{
            background-color: black;
            color: white;
        }
        div span{
            color: blue;
        }
    </style>
</head>
<body>
    <h1>Css Selector</h1>
    <p>
        Universal css(*)
    </p>
    <p>
        Element Selector
        <span>HEllo World</span>
    </p>
    <p>
        Id selector(#)
        <span id="first">Welcome to app</span>
    </p>
    <p>
        Class Selector
        <br>
         <span class="sec">list-1</span><br>
         <span class="sec">list-2</span><br>
         <span class="sec">list-3</span><br>
    </p>
    <div>
        Descendent selector
        <span>Inner span tag</span>
    </div>
</body>
</html>
