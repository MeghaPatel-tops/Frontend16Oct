<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        span{
            background-color: aqua;
            display: block;
             margin: 10px 0px;
        }
        .box{
            height: 100px;
            width: 100px;
            background-color: gray;
            margin: 10px 0px;
            display: inline-block;
        }
        nav{
           background-color: rgb(9, 9, 44);
           padding: 20px 100px;
        }
        nav ul li{
            width: 100px;
            display: inline-block;
          
        }
        nav ul li a{
            text-decoration: none;
            font-size:1.5em;
            color: white;
        }
        nav ul li:hover a{
            padding: 10px;
            background-color: white;
            color:rgb(9, 9, 44) ;
        }
    </style>
</head>
<body>
    <nav>
        
        <ul>
            <li><a href="">Images</a></li>
            <li><a href="">Canvas</a></li>
            <li><a href="">3d Paint</a></li>
        </ul>
    </nav>
    <span>Span-1</span>
    <span>Span-2</span>
    <span>Span-3</span>
    <div class="box">box-1</div>
    <div class="box">box-2</div>
    <div class="box">box-3</div>
</body>
</html>
