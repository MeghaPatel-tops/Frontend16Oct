<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            margin: 50px;
            height: 400px;
        }
        #main-1{
            background-color: greenyellow;
        }
        #main-2{
            background-image: url(back.jpg);
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }
        #main-3{
            background: linear-gradient(to left,red,rgb(159, 118, 118));
        }
         #main-4{
            background: radial-gradient(red,rgb(159, 118, 118));
        }
         #main-5{
            background: conic-gradient(red,rgb(159, 118, 118));
        }
    </style>
</head>
<body>
    <div class="main" id="main-1"></div>
    <div class="main" id="main-2"></div>
    <div class="main" id="main-3"></div>
    <div class="main" id="main-4"></div>
    <div class="main" id="main-5"></div>
</body>
</html>
