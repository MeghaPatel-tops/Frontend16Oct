<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .relative-div{
            background-color: gray;
            padding: 20px;
            position: relative;
            top: 100px;
            height: 300px;

        }
        .inner{
            height: 50px;
            width: 50px;
            background-color: black;
            position: absolute;
            top:0;
            right: 0;
        }
        .fixed{
            height: 200px;
            width: 200px;
            background-color: aqua;
            position: fixed;
            top:200px;
            right:0px;
            z-index: 1;
        }
        .sticky{
            background-color: black;
            color: white;
            position: sticky;
            top: 0;
            padding: 40px 0;
            text-align: center;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="sticky">
        <h1>Welcome to App</h1>
    </div>
    <div class="relative-div">
        Relative div
        <div class="inner"></div>
    </div>
    <div class="fixed">
        Fixed div example
    </div>
    <div class="relative-div">
        Relative div
        <div class="inner"></div>
    </div>
    <div class="relative-div">
        Relative div
        <div class="inner"></div>
    </div>
    <div class="relative-div">
        Relative div
        <div class="inner"></div>
    </div>
    <div class="relative-div">
        Relative div
        <div class="inner"></div>
    </div>
</body>
</html>
