<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            padding: 30px 100px;
            text-align: center;
            background-color: blue;
            color: white;
            border-radius: 50px;
            transition: transform 1s  ease-in ,border-radius 1s ease-in-out;
             
        }
        .box:hover{
            background-image:conic-gradient(skyblue 45deg, rgb(62, 110, 130) 90deg, blue 210deg);
            border-radius: 5px;
            transform: scale(3);
        }
    </style>
</head>
<body>
    <div class="box">
        Transform
    </div>
</body>
</html>
