<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1 align="center">Registration Form</h1>
    <form action="" method="post">
        <table align="center" border="1" cellspacing="10px" cellpadding="10px">
            <tr>
                <th>Name:</th>
                <td>
                    <input type="text" name="name" id="" placeholder="Your Name" required>
                </td>
                <th>Email</th>
                <td>
                    <input type="email" name="email" id="">
                </td>
            </tr>
            <tr>
                <th>Password</th>
                <td><input type="password" name="" id=""></td>
                <th>DOB</th>
                <td>
                    <input type="date" name="" id="">
                </td>
            </tr>
            <tr>
                <th>Address</th>
                <td>
                    <textarea name="" id=""></textarea>
                </td>
                <th>City</th>
                <td>
                    <select name="" id="">
                        <option value="">--select--</option>
                        <option value="">Surat</option>
                        <option value="">Vadodra</option>
                        <option value="">Vapi</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>Hobby</th>
                <td>
                    <input type="checkbox" name="" id="">Music
                    <input type="checkbox" name="" id="">Dance
                    <input type="checkbox" name="" id="">Sports

                </td>
                <th>Gender</th>
                <td>
                    <input type="radio" name="gender" id="">Male
                    <input type="radio" name="gender" id="">Female
                </td>
            </tr>
            <tr>
                
                    <th colspan="4">
                        <input type="submit" value="Submit">
                    </th>
               
            </tr>
        </table>
    </form>

    <fieldset align="center">
            <legend>Extra form Elements</legend>
            <label for="">Color</label>
            <input type="color" name="" id="">
            <br><br>
            <label for="">Number</label>
            <input type="number" name="" id="">
            <br><br>
            <label for="">Image</label>
            <input type="file" name="" id="">
            <br><br>
            <label for="">Date n time</label>
            <input type="datetime-local" name="" id="">
            <br><br>
            <label for="">Url</label>
            <input type="url" name="" id="">
            <br><br>
    </fieldset>

</body>
</html>
